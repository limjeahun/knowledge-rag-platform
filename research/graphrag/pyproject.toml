[project]
name = "knowledge-rag-comparison"
version = "0.1.0"
description = "Reproducible comparison harness for the production GraphRAG stack, Microsoft GraphRAG, and LightRAG."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "graphrag==3.1.0",
    "lightrag-hku[api]==1.5.4",
    "ollama==0.6.2",
]

[project.scripts]
rag-compare = "rag_compare.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_compare"]
