spring.application.name=knowledge-rag-platform

# REST API documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Local LLM (override every value with the matching environment variable)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:qwen3:4b}
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# PostgreSQL is the source of truth for documents, outbox events, and processed messages.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_study}
spring.datasource.username=${DB_USERNAME:ai}
spring.datasource.password=${DB_PASSWORD:ai}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Milvus is the only vector database. nomic-embed-text produces 768-dimensional vectors.
spring.ai.vectorstore.milvus.client.host=${MILVUS_HOST:localhost}
spring.ai.vectorstore.milvus.client.port=${MILVUS_PORT:19530}
spring.ai.vectorstore.milvus.database-name=${MILVUS_DATABASE:default}
spring.ai.vectorstore.milvus.collection-name=${MILVUS_COLLECTION:knowledge_chunks}
spring.ai.vectorstore.milvus.embedding-dimension=${EMBEDDING_DIMENSION:768}
spring.ai.vectorstore.milvus.index-type=IVF_FLAT
spring.ai.vectorstore.milvus.metric-type=COSINE
spring.ai.vectorstore.milvus.initialize-schema=true

# Kafka carries document-indexing requests published from the transactional outbox.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:knowledge-indexer}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=dev.study.airag.adapter.in.messaging
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=dev.study.airag.adapter.in.messaging.DocumentIndexingMessage
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.listener.ack-mode=record

# Redis is only a short-lived processing lock, never the source of truth.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

app.knowledge.indexing-topic=${KNOWLEDGE_INDEXING_TOPIC:knowledge.document-indexing.v1}
app.knowledge.consumer-name=${KNOWLEDGE_CONSUMER_NAME:knowledge-document-indexer-v1}
app.knowledge.lock-ttl=${KNOWLEDGE_LOCK_TTL:2m}
app.knowledge.outbox.fixed-delay=${OUTBOX_FIXED_DELAY:2s}
app.knowledge.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
app.knowledge.chunk-size=${KNOWLEDGE_CHUNK_SIZE:500}
app.knowledge.min-chunk-size-chars=${KNOWLEDGE_MIN_CHUNK_CHARS:100}
app.knowledge.max-chunks=${KNOWLEDGE_MAX_CHUNKS:1000}

# MCP Streamable HTTP server: POST/GET/DELETE http://localhost:8080/mcp
spring.ai.mcp.server.name=local-rag-knowledge
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=Search and answer questions using the local knowledge base.

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.observations.annotations.enabled=true
server.error.include-message=always
logging.file.name=${LOG_FILE:build/application.log}
